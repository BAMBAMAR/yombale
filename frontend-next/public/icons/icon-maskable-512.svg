<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nopalouMaskableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E22"/>
      <stop offset="35%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#C75B00"/>
      <stop offset="100%" stop-color="#9E3C00"/>
    </linearGradient>

    <linearGradient id="sheenMaskable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="softShadowMaskable" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8A3400" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <filter id="maskableSymbolDepth" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Corps de l'Icône : Squircle Continu aux coins nettement arrondis (26% de rayon) -->
  <g filter="url(#softShadowMaskable)">
    <rect x="26" y="26" width="460" height="460" rx="118" fill="url(#nopalouMaskableGrad)"/>
  </g>

  <!-- Lueur Interne Haute Fidélité -->
  <rect x="27.5" y="27.5" width="457" height="457" rx="116.5" fill="none" stroke="url(#sheenMaskable)" stroke-width="2.5"/>

  <!-- N officiel centré avec micro-profondeur -->
  <g filter="url(#maskableSymbolDepth)">
    <path fill-rule="evenodd" d="M120 108h272v296H120Z M324 108H188l136 198Z M188 404h136L188 206Z" fill="#FFFFFF"/>
  </g>
</svg>
