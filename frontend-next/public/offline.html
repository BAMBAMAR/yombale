<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hors-Ligne — Nopalou Sénégal</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f8fafc;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .box {
    max-width: 440px;
    background: #1e293b;
    border-radius: 24px;
    padding: 36px 28px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .badge {
    display: inline-block;
    background: rgba(199, 91, 0, 0.2);
    color: #fed7aa;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(199, 91, 0, 0.3);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  h1 {
    font-size: 22px;
    font-weight: 900;
    margin: 0 0 10px;
    color: #ffffff;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #94a3b8;
    margin: 0 0 24px;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button, a.btn {
    background: #C75B00;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(199,91,0,0.3);
    transition: transform 0.2s, background 0.2s;
  }
  button:active, a.btn:active { transform: scale(0.98); }
  a.btn-sec {
    background: #334155;
    color: #e2e8f0;
    box-shadow: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
      <svg width="64" height="64" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="offGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF7E22"/>
            <stop offset="35%" stop-color="#EA580C"/>
            <stop offset="70%" stop-color="#C75B00"/>
            <stop offset="100%" stop-color="#9E3C00"/>
          </linearGradient>
        </defs>
        <rect x="26" y="26" width="460" height="460" rx="118" fill="url(#offGrad)"/>
        <path fill-rule="evenodd" d="M120 108h272v296H120Z M324 108H188l136 198Z M188 404h136L188 206Z" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="badge">NOPALOU PWA · MODE HORS-LIGNE</div>
    <h1>Vous êtes actuellement Hors-Ligne</h1>
    <p>
      Votre connexion Internet mobile est momentanément interrompue. Les données précédemment consultées restent disponibles en cache local.
    </p>
    <div class="btn-group">
      <button onclick="location.reload()">Réessayer la connexion</button>
      <a href="/boutique/caisse" class="btn btn-sec">Retourner à la Caisse POS</a>
      <a href="/" class="btn btn-sec">Consulter l'Accueil (Cache)</a>
    </div>
  </div>

  <script>
    // Auto-recharge la page dès que la connexion Internet est rétablie
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
