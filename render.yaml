services:
  - type: web
    name: yombale-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SCRAPING_DISABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FB_EMAIL
        sync: false
      - key: FB_PASSWORD
        sync: false
      - key: FB_APP_ID
        sync: false
      - key: FB_APP_SECRET
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: ORANGE_CLIENT_ID
        sync: false
      - key: ORANGE_CLIENT_SECRET
        sync: false
      - key: ORANGE_MERCHANT_KEY
        sync: false

  - type: web
    name: nopalou-frontend
    runtime: node
    plan: free
    rootDir: frontend-next
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://nopalou.com"
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
