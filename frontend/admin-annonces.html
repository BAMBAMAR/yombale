<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Annonces classifiées — Nopalou</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; color: #1a1a1a; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  input, select { padding: 8px 10px; border: 1px solid #d8dadf; border-radius: 6px; font-size: 14px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; transition: opacity .15s; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-green { background: #059669; color: #fff; }
  .btn-red   { background: #e63946; color: #fff; }
  .btn-blue  { background: #2563eb; color: #fff; }
  .btn-gray  { background: #e2e8f0; color: #475569; }
  .btn-amber { background: #f59e0b; color: #fff; }
  .btn-sm    { padding: 4px 9px; font-size: 12px; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
  .msg.ok  { background: #e6f7ee; color: #1e7e4f; }
  .msg.err { background: #fde8e8; color: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { color: #666; font-weight: 600; background: #f8fafc; position: sticky; top: 0; }
  .badge { display:inline-flex; align-items:center; gap:4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space:nowrap; }
  .b-online  { background: #d1fae5; color: #059669; }
  .b-wait    { background: #e0f2fe; color: #0369a1; }
  .b-paid    { background: #fef3c7; color: #b45309; }
  .b-reject  { background: #fee2e2; color: #dc2626; }
  .b-nopay   { background: #f1f5f9; color: #64748b; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #f8fafc; border-radius: 10px; padding: 14px; text-align: center; border: 1.5px solid #e2e8f0; }
  .stat-card .val { font-size: 24px; font-weight: 800; }
  .stat-card .lbl { font-size: 11px; color: #64748b; margin-top: 2px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .desc-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #94a3b8; font-size: 11px; }
  .actions-cell { display:flex; gap:5px; flex-wrap:wrap; }
  tr:hover td { background: #fafafa; }
</style>
</head>
<body>

<h1>📢 Annonces classifiées</h1>
<p class="sub">Modération — toutes les annonces utilisateurs</p>

<div id="msg-zone"></div>

<div class="panel" id="auth-panel">
  <h2>🔐 Authentification admin</h2>
  <div style="display:flex;gap:10px;align-items:center">
    <input type="password" id="secret-input" placeholder="Secret admin" style="max-width:280px"
      onkeydown="if(event.key==='Enter')charger()">
    <button class="btn-blue" onclick="charger()">Charger</button>
  </div>
</div>

<div class="stats-grid" id="stats-zone" style="display:none">
  <div class="stat-card"><div class="val" style="color:#059669" id="s-online">—</div><div class="lbl">✓ En ligne</div></div>
  <div class="stat-card"><div class="val" style="color:#0369a1" id="s-wait">—</div><div class="lbl">⏳ En attente</div></div>
  <div class="stat-card"><div class="val" style="color:#b45309" id="s-paid">—</div><div class="lbl">💰 Payées (non publiées)</div></div>
  <div class="stat-card"><div class="val" style="color:#dc2626" id="s-reject">—</div><div class="lbl">❌ Rejetées</div></div>
  <div class="stat-card"><div class="val" style="color:#64748b" id="s-total">—</div><div class="lbl">Total</div></div>
</div>

<div class="panel" id="main-panel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0">Toutes les annonces</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn-blue btn-sm" onclick="charger()">↺ Actualiser</button>
      <button class="btn-green btn-sm" onclick="approuverToutGratuit()">✅ Approuver toutes gratuites en attente</button>
    </div>
  </div>

  <div class="filters">
    <select id="filtre-cat" onchange="filtrer()">
      <option value="">Toutes catégories</option>
      <option value="smartphones">📱 Téléphones</option>
      <option value="informatique">💻 Informatique</option>
      <option value="tv-electro">📺 TV & Électro</option>
      <option value="mode">👗 Mode</option>
      <option value="maison">🏠 Maison</option>
      <option value="auto-moto">🛵 Auto & Moto</option>
      <option value="jeux">🎮 Jeux</option>
      <option value="services">🔧 Services</option>
    </select>
    <select id="filtre-statut" onchange="filtrer()">
      <option value="">Tous statuts</option>
      <option value="online">✓ En ligne</option>
      <option value="wait">⏳ En attente (gratuites)</option>
      <option value="paid">💰 Payées non publiées</option>
      <option value="reject">❌ Rejetées</option>
      <option value="nopay">💳 Non payées</option>
    </select>
  </div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Catégorie</th>
          <th>Annonce</th>
          <th>Auteur</th>
          <th>Prix</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px">Chargement…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
var SECRET = '';
var _annonces = [];

var CAT_LABELS = {
  smartphones:'📱 Téléphones', informatique:'💻 Informatique',
  'tv-electro':'📺 TV & Électro', mode:'👗 Mode', maison:'🏠 Maison',
  'auto-moto':'🛵 Auto & Moto', jeux:'🎮 Jeux', services:'🔧 Services'
};

function e(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fcfa(n) { return n ? Number(n).toLocaleString('fr-FR') + ' FCFA' : '—'; }
function msg(txt, ok) {
  document.getElementById('msg-zone').innerHTML =
    '<div class="msg ' + (ok?'ok':'err') + '">' + e(txt) + '</div>';
  setTimeout(function(){ document.getElementById('msg-zone').innerHTML=''; }, 4000);
}

// Calcule le statut logique d'une annonce
function statutAnnonce(a) {
  if (a.actif)   return 'online';
  if (a.rejete)  return 'reject';
  if (a.payee)   return 'paid';
  return 'wait';  // gratuite en attente ou non payée → attente
}

function badgeHTML(a) {
  var s = statutAnnonce(a);
  if (s === 'online')  return '<span class="badge b-online">✓ En ligne</span>';
  if (s === 'reject')  return '<span class="badge b-reject">❌ Rejetée</span>';
  if (s === 'paid')    return '<span class="badge b-paid">💰 Payée — en attente</span>';
  if (!a.payee && !a.actif && !a.rejete)
                       return '<span class="badge b-wait">⏳ En attente</span>';
  return '<span class="badge b-nopay">💳 Non payée</span>';
}

function actionsHTML(a) {
  var btns = '';
  if (!a.actif && !a.rejete)
    btns += '<button class="btn-green btn-sm" onclick="approuver(\'' + a.id + '\')">✅ Approuver</button>';
  if (a.actif)
    btns += '<button class="btn-amber btn-sm" onclick="retirer(\'' + a.id + '\')">⏸ Retirer</button>';
  if (a.rejete)
    btns += '<button class="btn-gray btn-sm" onclick="remettre(\'' + a.id + '\')">↩ Remettre</button>';
  if (!a.rejete)
    btns += '<button class="btn-red btn-sm" onclick="rejeter(\'' + a.id + '\')">❌ Rejeter</button>';
  return '<div class="actions-cell">' + btns + '</div>';
}

async function charger() {
  SECRET = document.getElementById('secret-input').value.trim();
  if (!SECRET) { msg('Secret requis', false); return; }
  try {
    var r = await fetch('/api/annonces/admin/en-attente', { headers: { 'x-admin-secret': SECRET } });
    if (!r.ok) throw new Error('Accès refusé ou erreur serveur');
    var data = await r.json();
    _annonces = data.annonces || [];
    document.getElementById('stats-zone').style.display = 'grid';
    document.getElementById('main-panel').style.display = 'block';
    mettreAJourStats();
    filtrer();
    msg('Chargé — ' + _annonces.length + ' annonce(s)', true);
  } catch(err) { msg(err.message, false); }
}

function mettreAJourStats() {
  var online = _annonces.filter(function(a){ return a.actif; }).length;
  var wait   = _annonces.filter(function(a){ return !a.actif && !a.rejete && !a.payee; }).length
             + _annonces.filter(function(a){ return !a.actif && !a.rejete && a.payee; }).length;
  var paid   = _annonces.filter(function(a){ return !a.actif && !a.rejete && a.payee; }).length;
  var reject = _annonces.filter(function(a){ return a.rejete; }).length;
  document.getElementById('s-online').textContent = online;
  document.getElementById('s-wait').textContent   = _annonces.filter(function(a){ return !a.actif && !a.rejete; }).length;
  document.getElementById('s-paid').textContent   = paid;
  document.getElementById('s-reject').textContent = reject;
  document.getElementById('s-total').textContent  = _annonces.length;
}

function filtrer() {
  var cat    = document.getElementById('filtre-cat').value;
  var statut = document.getElementById('filtre-statut').value;
  var list   = _annonces.filter(function(a) {
    if (cat && a.categorie_slug !== cat) return false;
    if (!statut) return true;
    var s = statutAnnonce(a);
    if (statut === 'online' && s !== 'online')  return false;
    if (statut === 'reject' && s !== 'reject')  return false;
    if (statut === 'paid'   && s !== 'paid')    return false;
    if (statut === 'wait'   && !(!a.actif && !a.rejete && !a.payee)) return false;
    if (statut === 'nopay'  && (a.payee || a.actif || a.rejete))     return false;
    return true;
  });
  rendreTable(list);
}

function rendreTable(list) {
  var tbody = document.getElementById('tbody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:24px">Aucune annonce</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(a) {
    var rowStyle = a.rejete ? 'background:#fff5f5' : a.actif ? 'background:#f0fdf4' : '';
    return '<tr id="row-' + a.id + '" style="' + rowStyle + '">' +
      '<td style="white-space:nowrap;font-size:11px;color:#64748b">' +
        new Date(a.created_at).toLocaleDateString('fr-FR') + '<br>' +
        '<span style="font-size:10px">' + new Date(a.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) + '</span>' +
      '</td>' +
      '<td style="font-size:12px;white-space:nowrap">' + e(CAT_LABELS[a.categorie_slug] || a.categorie_slug) + '</td>' +
      '<td>' +
        '<div style="font-weight:700;font-size:13px;color:#1e293b">' + e(a.titre) + '</div>' +
        '<div class="desc-cell">' + e(a.description || '') + '</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px">📍 ' + e(a.ville||'') + (a.quartier ? ', ' + e(a.quartier) : '') + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-size:12px;font-weight:600;color:#1e293b">' + e(a.auteur_nom || '—') + '</div>' +
        '<div style="font-size:11px;color:#64748b">' + e(a.auteur_email || '') + '</div>' +
        '<div style="font-size:11px;color:#475569">📞 ' + e(a.contact_tel || '') + '</div>' +
      '</td>' +
      '<td style="font-size:12px;font-weight:700;white-space:nowrap;color:#1e293b">' + fcfa(a.prix) + '</td>' +
      '<td>' + badgeHTML(a) + '<div style="font-size:10px;color:#94a3b8;margin-top:4px">' + (a.payee ? '✓ payée' : '🆓 gratuite') + '</div></td>' +
      '<td>' + actionsHTML(a) + '</td>' +
    '</tr>';
  }).join('');
}

async function _action(id, body, successMsg) {
  try {
    var r = await fetch('/api/annonces/admin/' + id, {
      method: 'PUT',
      headers: { 'x-admin-secret': SECRET, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) { var d = await r.json().catch(function(){return {};}); throw new Error(d.error || 'Erreur serveur'); }
    _annonces = _annonces.map(function(a) {
      if (a.id !== id) return a;
      return Object.assign({}, a, body.actif !== undefined
        ? { actif: body.actif, rejete: !body.actif && body.rejete !== false ? a.rejete : (body.rejete || false) }
        : {}
      );
    });
    // Refresh complet depuis le serveur pour avoir l'état exact
    charger();
    msg(successMsg, true);
  } catch(err) { msg(err.message, false); }
}

function approuver(id) {
  _action(id, { actif: true }, '✅ Annonce approuvée et publiée');
}
function retirer(id) {
  if (!confirm('Retirer cette annonce de la publication (elle reste visible par l\'utilisateur) ?')) return;
  _action(id, { actif: false }, '⏸ Annonce retirée — repassée en attente');
}
function rejeter(id) {
  if (!confirm('Rejeter cette annonce ?\nL\'utilisateur verra le statut "Rejetée" et pourra la modifier.')) return;
  _action(id, { actif: false, rejete: true }, '❌ Annonce rejetée');
}
function remettre(id) {
  if (!confirm('Remettre cette annonce en attente de validation ?')) return;
  _action(id, { actif: false, rejete: false }, '↩ Annonce remise en attente');
}

async function approuverToutGratuit() {
  var liste = _annonces.filter(function(a){ return !a.payee && !a.actif && !a.rejete; });
  if (!liste.length) { msg('Aucune annonce gratuite en attente', true); return; }
  if (!confirm('Approuver ' + liste.length + ' annonce(s) gratuite(s) ?')) return;
  for (var i = 0; i < liste.length; i++) {
    await fetch('/api/annonces/admin/' + liste[i].id, {
      method: 'PUT',
      headers: { 'x-admin-secret': SECRET, 'Content-Type': 'application/json' },
      body: JSON.stringify({ actif: true })
    });
  }
  charger();
  msg('✅ ' + liste.length + ' annonce(s) approuvée(s)', true);
}
</script>
</body>
</html>
