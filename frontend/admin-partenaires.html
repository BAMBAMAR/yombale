<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Partenaires — Nopalou</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 24px; color: #1a1a1a; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
  .panel { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 14px; font-size: 16px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #059669; color: #fff; }
  .btn-danger  { background: #e63946; color: #fff; }
  .btn-sm      { padding: 5px 11px; font-size: 12px; }
  .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
  .msg.ok  { background: #e6f7ee; color: #1e7e4f; }
  .msg.err { background: #fde8e8; color: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; background: #f8fafc; }
  .actions button { margin-right: 6px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; }
  .badge.actif { background:#d1fae5; color:#065f46; }
  .badge.expire { background:#fee2e2; color:#991b1b; }
  .badge.inactif { background:#f1f5f9; color:#64748b; }
  .search-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .search-row input { flex:1; min-width:200px; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
  .search-row select { padding:8px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:12px; padding:24px; width:420px; max-width:95vw; box-shadow:0 8px 30px rgba(0,0,0,.15); }
  .modal h3 { margin:0 0 16px; font-size:16px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; color:#64748b; margin-bottom:4px; font-weight:600; }
  .form-group input, .form-group select { width:100%; padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .btn-secondary { background:#f1f5f9; color:#1a1a1a; }
</style>
</head>
<body>

<h1>🤝 Admin — Partenaires & Sponsoring</h1>
<p class="sub">Demandes partenariat + gestion des produits sponsorisés</p>

<div id="msg"></div>

<div class="panel">
  <h2>⏳ Demandes partenariat en attente</h2>
  <div id="pending-wrap">Chargement…</div>
</div>

<div class="panel">
  <h2>⭐ Produits sponsorisés</h2>
  <div class="search-row">
    <input type="text" id="q-produit" placeholder="Rechercher un produit par nom ou marque…" oninput="rechercherProduits()">
    <select id="filtre-actif" onchange="rechercherProduits()">
      <option value="">Tous les produits</option>
      <option value="1">Actifs seulement</option>
    </select>
    <button class="btn-primary" onclick="rechercherProduits()">Rechercher</button>
  </div>
  <div id="produits-wrap">Entrez un nom ou cliquez Rechercher pour afficher les produits.</div>
</div>

<!-- Modal configuration sponsoring -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-titre">Configurer le sponsoring</h3>
    <p id="modal-produit-nom" style="font-size:13px;color:#64748b;margin:0 0 16px"></p>
    <div class="form-group">
      <label>Statut</label>
      <select id="modal-statut">
        <option value="1">✅ Sponsorisé (actif)</option>
        <option value="0">❌ Désactiver</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date d'expiration (laisser vide = sans limite)</label>
      <input type="datetime-local" id="modal-date">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="fermerModal()">Annuler</button>
      <button class="btn-primary" onclick="sauvegarderSponsoring()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
function e(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

let SECRET = new URLSearchParams(location.search).get('secret') || sessionStorage.getItem('nopalou_admin_secret') || '';
if (!SECRET) {
  SECRET = prompt('Secret admin :') || '';
}
if (SECRET) sessionStorage.setItem('nopalou_admin_secret', SECRET);

function headers() {
  return { 'Content-Type': 'application/json', 'X-Admin-Secret': SECRET };
}

function showMsg(txt, ok) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = txt;
  setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
}

async function chargerEnAttente() {
  try {
    const r = await fetch('/api/partenaires/admin/en-attente', { headers: headers() });
    const d = await r.json();
    if (!Array.isArray(d) || !d.length) {
      document.getElementById('pending-wrap').innerHTML = '<p style="color:#94a3b8;text-align:center;padding:10px">Aucune demande en attente</p>';
      return;
    }
    document.getElementById('pending-wrap').innerHTML = `<table><thead><tr><th>Entreprise</th><th>Secteur</th><th>Contact</th><th>Email</th><th>Description</th><th>Actions</th></tr></thead><tbody>${d.map(p => `
      <tr>
        <td>${e(p.nom_entreprise)}</td>
        <td>${e(p.secteur || '—')}</td>
        <td>${e(p.contact_nom || '')} ${e(p.contact_tel || '')}</td>
        <td>${e(p.email)}</td>
        <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e(p.description || '')}">${e(p.description || '—')}</td>
        <td class="actions">
          <button class="btn-primary btn-sm" onclick="traiterDemande('${e(p.id)}','approuve')">✓ Approuver</button>
          <button class="btn-danger btn-sm" onclick="traiterDemande('${e(p.id)}','rejete')">✕ Rejeter</button>
        </td>
      </tr>`).join('')}</tbody></table>`;
  } catch(e) {
    document.getElementById('pending-wrap').innerHTML = '<p style="color:#e63946">Erreur : ' + e.message + '</p>';
  }
}

async function traiterDemande(id, statut) {
  try {
    const r = await fetch(`/api/partenaires/${id}`, { method: 'PUT', headers: headers(), body: JSON.stringify({ statut }) });
    if (!r.ok) throw new Error((await r.json()).error);
    showMsg(statut === 'approuve' ? 'Demande approuvée ✓' : 'Demande rejetée ✓', true);
    chargerEnAttente();
  } catch(e) { showMsg('Erreur : ' + e.message, false); }
}

// ── Produits sponsorisés ──────────────────────────────────────────
let searchTimer = null;
function rechercherProduits() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(_doSearch, 300);
}

async function _doSearch() {
  const q = document.getElementById('q-produit').value.trim();
  const actifs = document.getElementById('filtre-actif').value;
  const wrap = document.getElementById('produits-wrap');
  wrap.textContent = 'Chargement…';
  try {
    const qs = new URLSearchParams();
    if (q) qs.set('q', q);
    if (actifs) qs.set('actifs_seulement', actifs);
    const r = await fetch(`/api/produits/admin/sponsorises?${qs}`, { headers: headers() });
    if (!r.ok) throw new Error((await r.json()).error || 'Erreur');
    const data = await r.json();
    if (!data.length) {
      wrap.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:12px">Aucun produit trouvé</p>';
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr>
        <th>Image</th><th>Produit</th><th>Catégorie</th><th>Prix min</th><th>Offres</th><th>Sponsoring</th><th>Expiration</th><th>Action</th>
      </tr></thead>
      <tbody>${data.map(p => {
        const now = new Date();
        const exp = p.sponsor_jusqu_au ? new Date(p.sponsor_jusqu_au) : null;
        const actif = p.sponsorise && (!exp || exp > now);
        const badge = p.sponsorise
          ? (actif ? '<span class="badge actif">Actif</span>' : '<span class="badge expire">Expiré</span>')
          : '<span class="badge inactif">Inactif</span>';
        const expTxt = exp ? exp.toLocaleDateString('fr-FR') + ' ' + exp.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) : '—';
        const img = p.image_url
          ? `<img src="${e(p.image_url)}" style="width:40px;height:40px;object-fit:cover;border-radius:4px">`
          : '<div style="width:40px;height:40px;background:#f1f5f9;border-radius:4px"></div>';
        return `<tr>
          <td>${img}</td>
          <td><b>${e(p.nom)}</b><br><span style="font-size:11px;color:#64748b">${e(p.marque || '—')}</span></td>
          <td>${e(p.categorie_nom || '—')}</td>
          <td>${p.prix_min ? Number(p.prix_min).toLocaleString('fr-FR') + ' FCFA' : '—'}</td>
          <td>${p.nb_offres}</td>
          <td>${badge}</td>
          <td style="font-size:12px">${expTxt}</td>
          <td><button class="btn-primary btn-sm" onclick="ouvrirModal('${e(p.id)}','${e(p.nom + (p.marque ? ' — ' + p.marque : ''))}',${p.sponsorise ? 1 : 0},'${p.sponsor_jusqu_au || ''}')">Configurer</button></td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  } catch(err) {
    wrap.innerHTML = `<p style="color:#e63946">Erreur : ${e(err.message)}</p>`;
  }
}

// ── Modal ─────────────────────────────────────────────────────────
let _currentProduitId = null;
function ouvrirModal(id, nom, sponsorise, jusqu_au) {
  _currentProduitId = id;
  document.getElementById('modal-produit-nom').textContent = nom;
  document.getElementById('modal-statut').value = sponsorise ? '1' : '0';
  if (jusqu_au) {
    // Convertir en format datetime-local (YYYY-MM-DDTHH:MM)
    const d = new Date(jusqu_au);
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0,16);
    document.getElementById('modal-date').value = local;
  } else {
    document.getElementById('modal-date').value = '';
  }
  document.getElementById('modal-overlay').classList.add('open');
}

function fermerModal() {
  _currentProduitId = null;
  document.getElementById('modal-overlay').classList.remove('open');
}

async function sauvegarderSponsoring() {
  if (!_currentProduitId) return;
  const sponsorise = document.getElementById('modal-statut').value === '1';
  const dateVal = document.getElementById('modal-date').value;
  const sponsor_jusqu_au = dateVal ? new Date(dateVal).toISOString() : null;
  try {
    const r = await fetch(`/api/produits/admin/${_currentProduitId}/sponsoring`, {
      method: 'PUT',
      headers: headers(),
      body: JSON.stringify({ sponsorise, sponsor_jusqu_au })
    });
    if (!r.ok) throw new Error((await r.json()).error || 'Erreur');
    showMsg('Sponsoring mis à jour ✓', true);
    fermerModal();
    _doSearch();
  } catch(err) { showMsg('Erreur : ' + err.message, false); }
}

// Fermer la modal en cliquant sur l'overlay
document.getElementById('modal-overlay').addEventListener('click', function(ev) {
  if (ev.target === this) fermerModal();
});

chargerEnAttente();
// Charger les produits sponsorisés actifs au démarrage
document.getElementById('filtre-actif').value = '1';
_doSearch();
</script>
</body>
</html>
