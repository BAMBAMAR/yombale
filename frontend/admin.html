<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nopalou</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 0; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 14px 24px; }
  header h1 { font-size: 20px; margin: 0 0 10px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab { cursor: pointer; border: 1.5px solid #e2e8f0; background: #fff; color: #475569; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; }
  .tab.active { background: #059669; color: #fff; border-color: #059669; }
  iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<header>
  <h1>⚙️ Administration Nopalou</h1>
  <div class="tabs">
    <div class="tab active" data-page="admin-immo.html" onclick="ouvrirOnglet(this)">🏡 Immobilier</div>
    <div class="tab" data-page="admin-partenaires.html" onclick="ouvrirOnglet(this)">🤝 Partenaires</div>
    <div class="tab" data-page="admin-telecom.html" onclick="ouvrirOnglet(this)">📶 Télécom</div>
  </div>
</header>

<iframe id="frame"></iframe>

<script>
let SECRET = new URLSearchParams(location.search).get('secret') || sessionStorage.getItem('nopalou_admin_secret') || '';
if (!SECRET) {
  SECRET = prompt('Secret admin :') || '';
}
if (SECRET) sessionStorage.setItem('nopalou_admin_secret', SECRET);

function ouvrirOnglet(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('frame').src = el.dataset.page + '?secret=' + encodeURIComponent(SECRET);
}

ouvrirOnglet(document.querySelector('.tab.active'));
</script>
</body>
</html>
