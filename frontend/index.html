<body>
  <nav id="navbar">
    <div class="logo" onclick="goHome()">Nopalou <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2" width="22" height="15" style="vertical-align:middle;border-radius:2px;flex-shrink:0;margin-left:2px" aria-label="Sénégal"><rect width="1" height="2" fill="#00853F"/><rect x="1" width="1" height="2" fill="#FDEF42"/><rect x="2" width="1" height="2" fill="#E31B23"/><polygon points="1.5,0.78 1.55,0.93 1.71,0.93 1.59,1.03 1.63,1.18 1.5,1.09 1.37,1.18 1.41,1.03 1.29,0.93 1.45,0.93" fill="#00853F"/></svg></div>
    <div class="nav-center">
      <button onclick="goHome()">Accueil</button>
      <button onclick="loadPromos()">Promos</button>
      <div style="position:relative" id="nav-guides-wrap">
        <button onclick="toggleNavGuides()" id="nav-btn-guides" aria-haspopup="true" aria-expanded="false"

          📚 Guides <span id="nav-guides-arrow" style="font-size:10px;display:inline-block;transition:transform .2s">▾</span>
        </button>
        <div id="nav-guides-dropdown" role="menu" style="display:none;position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.14);min-width:252px;z-index:502;overflow:hidden;padding:6px 0">
          <button onclick="ouvrirGuideAchat();closeNavGuides()" role="menuitem"
            style="display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 16px;font-size:13px;cursor:pointer;text-align:left"
            onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
            <span style="font-size:20px;flex-shrink:0">🏆</span>
            <div><div style="font-weight:700;color:#1e293b">Guide d'achat intelligent</div><div style="font-size:11px;color:#94a3b8">Classement personnalisé de produits</div></div>
          </button>
          <button onclick="ouvrirWizardForfait();closeNavGuides()" role="menuitem"
            style="display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 16px;font-size:13px;cursor:pointer;text-align:left"
            onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">
            <span style="font-size:20px;flex-shrink:0">🎯</span>
            <div><div style="font-weight:700;color:#1e293b">Guide d'achat forfait</div><div style="font-size:11px;color:#94a3b8">Trouver le meilleur forfait télécom</div></div>
          </button>
          <button onclick="ouvrirWizardImmo();closeNavGuides()" role="menuitem"
            style="display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 16px;font-size:13px;cursor:pointer;text-align:left"
            onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background=''">

            <div><div style="font-weight:700;color:#1e293b">Guide immobilier</div><div style="font-size:11px;color:#94a3b8">Trouver mon logement idéal</div></div>

          <div style="height:1px;background:#f1f5f9;margin:4px 8px"></div>
          <button onclick="ouvrirGuideEmploi();closeNavGuides()" role="menuitem"
            style="display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;padding:11px 16px;font-size:13px;cursor:pointer;text-align:left"

    <button class="nav-hamburger" onclick="toggleNavMenu()" aria-label="Menu de navigation">☰</button>

        <option value="Saint-Louis">Saint-Louis</option>

          <span id="nav-username">Connexion</span>

  <!-- Barre favoris sticky (bas d'écran) -->
  <div id="fav-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:299;
    background:#fff;border-top:2.5px solid #ef4444;box-shadow:0 -4px 24px rgba(0,0,0,.10);
    padding:10px 5%;align-items:center;gap:12px;flex-wrap:wrap">

    <div style="display:flex;gap:8px;flex-shrink:0">
      <button onclick="afficherFavoris()"
        style="padding:8px 18px;background:#ef4444;color:#fff;border:none;border-radius:9px;
               font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">
        ❤ Voir (<span id="fav-bar-count">0</span>)
      </button>
      <button onclick="viderFavoris()"
        style="padding:8px 14px;background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca;
               border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">
        ✕
      </button>
    </div>
  </div>

  <!-- Barre de comparaison sticky (bas d'écran) -->
  <div id="compare-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:300;
    background:#fff;border-top:2.5px solid #f97316;box-shadow:0 -4px 24px rgba(0,0,0,.13);
    padding:10px 5%;align-items:center;gap:12px;flex-wrap:wrap">
    <span style="font-size:12px;font-weight:800;color:#f97316;white-space:nowrap;flex-shrink:0">⚖ Sélection</span>
    <div id="compare-bar-items" style="flex:1;display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;padding:2px 0"></div>
    <div style="display:flex;gap:8px;flex-shrink:0">
      <button id="compare-bar-btn" onclick="ouvrirComparaisonNav()"
        style="padding:8px 18px;background:#f97316;color:#fff;border:none;border-radius:9px;
               font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">
        ⚖ Comparer (0)
      </button>
      <button onclick="viderComparaison()"
        style="padding:8px 14px;background:#fef2f2;color:#ef4444;border:1.5px solid #fecaca;
               border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">
        ✕ Vider
      </button>
    </div>
  </div>

  <script src="/app.js?v=46" defer></script>
  <script>
    // Désenregistrer l'ancien Service Worker pour forcer le rechargement des assets
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) {
          reg.update(); // forcer vérification de mise à jour
        });
      });
      navigator.serviceWorker.register('/service-worker.js')
        .then(function() { console.log('SW OK'); })
        .catch(function(e) { console.warn('SW:', e.message); });
    }
