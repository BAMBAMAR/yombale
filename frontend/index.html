  <script>
    // Ripple Effect pour interactions tactiles et visuelles instantanées (WCAG & Ergonomie)
    document.addEventListener('click', function(e) {
      const target = e.target.closest('button, .chip, .pcard, .nav-user');
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const circle = document.createElement('span');
      const diameter = Math.max(rect.width, rect.height);
      const radius = diameter / 2;
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');
      const existing = target.getElementsByClassName('ripple')[0];
      if (existing) existing.remove();
      target.appendChild(circle);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.update(); });
      });
      navigator.serviceWorker.register('/service-worker.js')
        .then(function() { console.log('SW OK'); })
        .catch(function(e) { console.warn('SW:', e.message); });
    }
  </script>
