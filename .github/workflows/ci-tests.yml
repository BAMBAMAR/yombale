name: CI — Tests avant déploiement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend-gate:
    name: Frontend Quality Gate (TypeScript, Slop, Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Installer les dépendances frontend
        working-directory: frontend-next
        run: npm ci
      - name: Vérification TypeScript stricte
        working-directory: frontend-next
        run: npx tsc --noEmit
      - name: Linter Anti-AI-Slop
        working-directory: frontend-next
        run: node scripts/lint-ai-slop.mjs
      - name: Tests unitaires métier frontend (69 tests)
        working-directory: frontend-next
        run: node --experimental-strip-types scripts/run-unit-tests.mjs

  backend-tests:
    name: Tests Backend Jest (Unitaires & Intégration DB Réelle)
    runs-on: ubuntu-latest
    needs: frontend-gate
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nopalou_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - name: Tests Unitaires Backend Jest (373 tests)
        run: npm run test:unit:ci
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-default-key-for-ci-testing' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_TEST || 'test-admin-secret-for-ci-testing' }}
          WAVE_WEBHOOK_SECRET: ${{ secrets.WAVE_WEBHOOK_SECRET_TEST || 'test-wave-webhook-secret-ci' }}
      - name: Tests d'Intégration Backend DB Réelle (22 tests)
        run: npm run test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:testpassword@localhost:5432/nopalou_test
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'test-jwt-secret-default-key-for-ci-testing' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_TEST || 'test-admin-secret-for-ci-testing' }}
          WAVE_WEBHOOK_SECRET: ${{ secrets.WAVE_WEBHOOK_SECRET_TEST || 'test-wave-webhook-secret-ci' }}

  e2e-smoke:
    name: Tests E2E Smoke & Régression Playwright
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exécuter Smoke & Régression E2E
        run: npx playwright test tests/e2e/00-smoke.spec.ts tests/e2e/05-api.spec.ts tests/e2e/06-mobile-overflow-audit.spec.ts tests/e2e/99-regression.spec.ts
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET_TEST }}
